name: iOS build → TestFlight

# Run this from the Actions tab ("Run workflow") once the first build has
# been done from a computer (that first run sets up Apple signing).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Start the cloud build and send it to TestFlight when done
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
